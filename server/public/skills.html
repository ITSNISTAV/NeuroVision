<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroVision — Skills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="skills.css">
</head>
<body>

  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <style>
    .nav-links { display: flex; gap: 8px; }
    .nav-link { font-size: 13px; color: var(--text-secondary); padding: 6px 14px; border-radius: 40px; text-decoration: none; transition: all 0.2s; }
    .nav-link:hover { background: var(--glass-bg); color: var(--text-primary); }
    .user-pill { display: flex; align-items: center; gap: 12px; background: var(--glass-bg); padding: 4px 12px 4px 8px; border-radius: 60px; border: 1px solid var(--glass-border); cursor: pointer; }
    .user-label { font-size: 9px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
  </style>

  <nav class="navbar">
    <div class="logo">
      <span class="logo-symbol">✦</span>
      <span class="logo-text">NeuroVision</span>
    </div>
    <div class="nav-links">
      <a class="nav-link" href="/dashboard.html">Home</a>
      <a class="nav-link" href="/skills.html">Profile</a>
      <a class="nav-link" href="/skillGap.html">Skill Gap</a>
      <a class="nav-link" href="/score.html">Score</a>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="user-pill" onclick="document.getElementById('avatar-upload').click()" style="margin: 0;">
        <div>
          <div class="user-name" id="nav-username">—</div>
          <div class="user-label">CANDIDATE</div>
        </div>
        <div class="avatar" id="nav-avatar">?</div>
        <img id="nav-profile-pic" style="display:none; width:36px; height:36px; border-radius:50%; object-fit:cover;">
      </div>
      <button class="logout-btn" onclick="logout()" title="Logout" style="background: transparent; border: 1px solid rgba(168,85,247,0.3); color: rgba(196,181,253,0.5); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 16px;">⏻</button>
    </div>
  </nav>
  <input type="file" id="avatar-upload" accept="image/*" style="display: none;" onchange="uploadAvatarFile(event)">

  <div class="page-wrapper">

    <section class="form-section glass-card">
      <div class="section-header">
        <div>
          <h2>Career Role Profile</h2>
          <p class="section-sub">Define your role and showcase your technical expertise</p>
        </div>
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label>Role <span class="req">*</span></label>
          <div class="select-wrapper">
            <select id="role"></select>
            <span class="select-arrow">▾</span>
          </div>
        </div>

        <div class="form-group">
          <label>CGPA <span class="req">*</span></label>
          <input type="number" id="cgpa" min="1" max="10" step="0.1" placeholder="e.g. 8.5">
        </div>

        <div class="form-group full-width">
          <label>Internship Experience</label>
          <div class="counter">
            <button class="counter-btn" onclick="changeInternship(-1)">−</button>
            <span id="internshipMonths" class="counter-value">0 Months</span>
            <button class="counter-btn" onclick="changeInternship(1)">+</button>
            <button class="reset-small" onclick="resetInternship()">↺ Reset</button>
          </div>
        </div>

        <div class="form-group">
          <label>Technical Skill <span class="req">*</span></label>
          <div class="select-wrapper">
            <select id="skillSelect"></select>
            <span class="select-arrow">▾</span>
          </div>
        </div>

        <div class="form-group">
          <label>Proficiency Level (1–5)</label>
          <div class="skill-input-group">
            <input type="number" id="skillLevel" min="1" max="5" placeholder="e.g. 4">
            <button class="btn-add" onclick="addSkill()">＋ Add Skill</button>
          </div>
        </div>

        <div class="form-group full-width">
          <div id="skillsList" class="skills-chips"></div>
        </div>

      </div>

      <div class="form-actions">
        <button class="btn-reset" onclick="resetForm()">↺ Reset Form</button>
        <button class="btn-submit" onclick="saveProfile()">Save Profile →</button>
      </div>
    </section>

    <section class="display-section">
      <div class="display-header">
        <h2>Saved Role Profiles</h2>
        <span id="roleCount" class="badge">0 profiles</span>
      </div>
      <div id="rolesDisplay" class="roles-grid"></div>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">◈</div>
        <p>No profiles saved yet.<br>Fill the form above to get started.</p>
      </div>
    </section>

  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
